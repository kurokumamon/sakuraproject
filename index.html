<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>さくらトーク</title>
  <meta name="theme-color" content="#f48fb1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="さくらトーク">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // 招待QRから iPhone の Safari で開いたときは、manifest を外しておく。
    // こうすると「ホーム画面に追加」したアイコンが招待コードつきの URL を覚えるので、
    // アイコンから開いたときにそのまま参加できる。
    if (new URLSearchParams(location.search).has('join') && navigator.standalone === false) {
      var m = document.querySelector('link[rel="manifest"]');
      if (m) m.remove();
    }
  </script>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="app"><p class="center muted">よみこみちゅう…</p></div>
  <div id="toast" hidden></div>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
